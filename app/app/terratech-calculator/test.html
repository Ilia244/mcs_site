<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>TerraTech 計算機（localStorage版）</title>
<style>
body { font-family: sans-serif; background:#111; color:#eee; padding:20px;}
select,input,button{margin:5px;padding:6px;}
table{border-collapse:collapse;margin-top:10px;width:100%;}
td,th{border:1px solid #555;padding:6px;text-align:center;}
.summaryBox{background:#222;padding:10px;border:1px solid #555;margin-bottom:15px;}
h2{margin-top:30px;}
.sectionBox{background:#222;padding:10px;margin-bottom:15px;border:1px solid #555;}
</style>
</head>
<body>

<h1>TerraTech 計算機（localStorage版）</h1>

<div class="sectionBox">
<h2>計算モード</h2>
<select id="mode">
  <option value="block">資源ブロック計算</option>
  <option value="raw">資源合計計算</option>
</select>
<br>
企業:
<select id="corp"></select>
資源:
<select id="resource"></select>
個数:
<input type="number" id="amount" value="1">
<button onclick="addOrUpdate()" id="mainBtn">追加</button>
<button onclick="manualCombine()">手動合算</button>
<button onclick="toggleAutoCombine()" id="autoBtn">自動合算: オフ</button>
<button onclick="resetData()">リセット</button>
</div>

<h2>合計</h2>
<div id="summary" class="summaryBox"></div>

<h2>入力リスト</h2>
<table id="inputList"></table>

<div class="sectionBox">
<h2>企業管理</h2>
企業名: <input type="text" id="newCorpName">
ブロック個数: <input type="number" id="newCorpBlock" value="1">
<button onclick="addCorp()">追加</button>
<table id="corpList"></table>
</div>

<div class="sectionBox">
<h2>資源管理</h2>
資源名: <input type="text" id="newResName">
単価: <input type="number" id="newResPrice" value="1">
<button onclick="addResource()">追加</button>
<table id="resList"></table>
</div>

<script>
// ===== データ =====
let defaultData = {
  corps: { GSO:24, GEO:120, VEN:8, HE:64, BF:42 },
  resources: [
    {name:"木材", refined:6},
    {name:"フィブロンの塊", refined:9},
    {name:"高密度フィブロンの塊", refined:14},
    {name:"ゴム樹脂", refined:12},
    {name:"ゴムレンガ", refined:18},
    {name:"ルクサイトの破片", refined:15},
    {name:"ルクサイトの結晶", refined:23},
    {name:"メタリウム鉱石", refined:18},
    {name:"メタリウムインゴット", refined:27},
    {name:"チタナイト鉱石", refined:20},
    {name:"チタナイトインゴット", refined:30},
    {name:"カーボナイト繊維", refined:30},
    {name:"カーボナイト高密度繊維", refined:45},
    {name:"カーバイトレンガ", refined:75},
    {name:"ローダイト鉱石", refined:55},
    {name:"ローダイトカプセル", refined:83},
    {name:"オレイト樹脂", refined:60},
    {name:"オレイトレンガ", refined:90},
    {name:"イグナイトの破片", refined:150},
    {name:"イグナイトの結晶", refined:225},
    {name:"エルダイトの破片", refined:155},
    {name:"エルダイトの結晶", refined:233},
    {name:"セレスタイトの破片", refined:160},
    {name:"セレスタイトの結晶", refined:240}
  ]
};

let list = [];
let editIndex = null;
let autoCombine = false;

function resetData(){
  if(!confirm("データを初期化してリセットします。よろしいですか？")) return;
  localStorage.removeItem("tt_calc_data");  // localStorageクリア
  data = JSON.parse(JSON.stringify(defaultData));  // 初期データをコピー
  updateCorpSelect();
  updateResourceSelect();
  renderCorpList();
  renderResList();
  updateAll();
}

// ===== localStorage 保存/読み込み =====
function saveData(){ localStorage.setItem("tt_calc_data", JSON.stringify(data)); }
function loadData(){ 
  let stored = localStorage.getItem("tt_calc_data"); 
  return stored ? JSON.parse(stored) : JSON.parse(JSON.stringify(defaultData)); 
}

let data = loadData();

// ===== 初期化 =====
init();

function init(){
  updateCorpSelect();
  updateResourceSelect();
  renderCorpList();
  renderResList();
  updateAll();
}

// ===== ドロップダウン更新 =====
function updateCorpSelect(){
  const corpSel = document.getElementById("corp");
  corpSel.innerHTML="";
  Object.keys(data.corps).forEach(c=>{
    corpSel.innerHTML+=`<option value="${c}">${c}</option>`;
  });
}

function updateResourceSelect(){
  const sel = document.getElementById("resource");
  sel.innerHTML = "";
  data.resources.forEach(r=>{
    sel.innerHTML += `<option value="${r.name}">${r.name}</option>`;
  });
}

// ===== 計算リスト操作 =====
function addOrUpdate(){
  const corp = document.getElementById("corp").value;
  const name = document.getElementById("resource").value;
  const amt = parseInt(document.getElementById("amount").value);
  if(!amt || amt<=0) return;

  if(editIndex===null){ list.push({corp,name,amt}); }
  else{ list[editIndex]={corp,name,amt}; editIndex=null; document.getElementById("mainBtn").innerText="追加"; document.getElementById("corp").disabled=false; }

  document.getElementById("amount").value=1;
  updateAll();
}

function editItem(i){
  const item=list[i];
  editIndex=i;
  document.getElementById("mainBtn").innerText="更新";
  document.getElementById("corp").value=item.corp;
  document.getElementById("corp").disabled=true;
  document.getElementById("resource").value=item.name;
  document.getElementById("amount").value=item.amt;
}

function removeItem(i){ list.splice(i,1); updateAll(); }

function manualCombine(){
  let combined={};
  list.forEach(item=>{ const key=item.corp+"_"+item.name; if(!combined[key]) combined[key]={...item}; else combined[key].amt+=item.amt; });
  list=Object.values(combined); updateAll();
}

function toggleAutoCombine(){ autoCombine=!autoCombine; document.getElementById("autoBtn").innerText="自動合算: "+(autoCombine?"オン":"オフ"); updateAll(); }

// ===== 表示 =====
function renderList(){
  const mode=document.getElementById("mode").value;
  const table=document.getElementById("inputList");
  let html=`<tr><th>企業</th><th>資源</th><th>個数</th><th>単価</th><th>合計</th><th>計算式</th><th>操作</th></tr>`;

  let displayList = autoCombine ? getCombinedList() : list;

  displayList.forEach((item,i)=>{
    const r=data.resources.find(x=>x.name===item.name);
    const blockSize=data.corps[item.corp];
    let totalRes, price, formula, totalValue;
    if(mode==="block"){ totalRes=item.amt*blockSize; price=r.refined; totalValue=totalRes*price; formula=`${item.amt} × ${blockSize} × ${price}`; }
    else{ totalRes=item.amt; price=r.refined; totalValue=totalRes*price; formula=`${item.amt} × ${price}`; }
    html+=`<tr>
      <td>${item.corp}</td>
      <td>${item.name}</td>
      <td>${item.amt}</td>
      <td>${price}</td>
      <td>${totalValue}</td>
      <td>${formula}</td>
      <td>
        <button onclick="editItem(${i})">編集</button>
        <button onclick="removeItem(${i})">削除</button>
      </td>
    </tr>`;
  });

  if(autoCombine){
    let origHtml=`<tr><th colspan=7>元の入力リスト</th></tr>`;
    list.forEach((item,i)=>{
      origHtml+=`<tr>
      <td>${item.corp}</td>
      <td>${item.name}</td>
      <td>${item.amt}</td>
      <td></td><td></td><td></td><td></td>
      </tr>`;
    });
    html+=origHtml;
  }

  table.innerHTML=html;
}

function getCombinedList(){
  let combined={};
  list.forEach(item=>{ const key=item.corp+"_"+item.name; if(!combined[key]) combined[key]={...item}; else combined[key].amt+=item.amt; });
  return Object.values(combined);
}

function calc(){
  const mode=document.getElementById("mode").value;
  let summary={};
  const displayList = autoCombine ? getCombinedList() : list;
  displayList.forEach(item=>{
    const r=data.resources.find(x=>x.name===item.name);
    const blockSize=data.corps[item.corp];
    if(!summary[item.corp]) summary[item.corp]={res:0,val:0};
    if(mode==="block"){ summary[item.corp].res+=item.amt*blockSize; summary[item.corp].val+=item.amt*blockSize*r.refined; }
    else{ summary[item.corp].res+=item.amt; }
  });

  let html="";
  for(let corp in summary){
    const total=summary[corp].res;
    const val=summary[corp].val;
    const size=data.corps[corp];
    if(mode==="block"){ html+=`<p>${corp} → 総資源:${total} / 売却:${val}</p>`; }
    else{ html+=`<p>${corp} → 総資源:${total} / ブロック:${Math.floor(total/size)} / 余り:${total%size}</p>`; }
  }
  document.getElementById("summary").innerHTML=html||"データなし";
}

function updateAll(){ renderList(); calc(); saveData(); }

document.getElementById("mode").onchange=updateAll;
document.getElementById("corp").onchange=updateAll;

// ===== 企業管理 =====
function renderCorpList(){
  const table=document.getElementById("corpList");
  let html=`<tr><th>企業名</th><th>ブロック個数</th><th>操作</th></tr>`;
  Object.entries(data.corps).forEach(([c,blk],i)=>{
    html+=`<tr>
      <td>${c}</td>
      <td>${blk}</td>
      <td>
        <button onclick="editCorp('${c}')">編集</button>
        <button onclick="removeCorp('${c}')">削除</button>
      </td>
    </tr>`;
  });
  table.innerHTML=html;
}

function addCorp(){
  const name=document.getElementById("newCorpName").value.trim();
  const blk=parseInt(document.getElementById("newCorpBlock").value);
  if(!name || !blk) return;
  data.corps[name]=blk;
  updateCorpSelect(); renderCorpList(); updateAll();
}

function editCorp(name){
  const blk=prompt("ブロック個数を入力", data.corps[name]);
  if(blk) data.corps[name]=parseInt(blk);
  renderCorpList(); updateAll();
}

function removeCorp(name){
  if(!confirm(`企業 ${name} を削除しますか？`)) return;
  delete data.corps[name];
  list=list.filter(l=>l.corp!==name);
  updateCorpSelect(); renderCorpList(); updateAll();
}

// ===== 資源管理 =====
function renderResList(){
  const table=document.getElementById("resList");
  let html=`<tr><th>資源名</th><th>単価</th><th>操作</th></tr>`;
  data.resources.forEach((r,i)=>{
    html+=`<tr>
      <td>${r.name}</td>
      <td>${r.refined}</td>
      <td>
        <button onclick="editRes(${i})">編集</button>
        <button onclick="removeRes(${i})">削除</button>
      </td>
    </tr>`;
  });
  table.innerHTML=html;
}

function addResource(){
  const name=document.getElementById("newResName").value.trim();
  const price=parseInt(document.getElementById("newResPrice").value);
  if(!name || !price) return;
  data.resources.push({name, refined: price});
  updateResourceSelect(); renderResList(); updateAll();
}

function editRes(i){
  const r=data.resources[i];
  const name=prompt("資源名", r.name);
  const price=parseInt(prompt("単価", r.refined));
  if(name && price) { r.name=name; r.refined=price; updateResourceSelect(); renderResList(); updateAll(); }
}

function removeRes(i){ data.resources.splice(i,1); updateResourceSelect(); renderResList(); updateAll(); }

</script>

</body>
</html>
